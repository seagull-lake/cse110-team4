name: Problem Engine Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Problem engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run problem dispatcher, generator, and integration tests
        run: >-
          npm test -- --run --cache=false
          src/problem-engine/ProblemDispatcher.test.ts
          src/problem-engine/MultiplicationDivisionGenerator.test.ts
          src/problem-engine/ProblemEngine.integration.test.ts
