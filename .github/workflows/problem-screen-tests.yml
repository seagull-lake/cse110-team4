name: Problem Screen Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Main problem screen tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run main problem screen unit tests
        run: >-
          npm test -- --run --cache=false
          src/screens/MainProblemScreen/MainProblemScreenController.test.ts
          src/screens/MainProblemScreen/MainProblemScreenModel.test.ts
          src/screens/MainProblemScreen/MainProblemLayout.test.ts
          src/screens/MainProblemScreen/MainProblemRows.test.ts
