name: Solution Screen Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Solution screen tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run solution screen and shared component unit tests
        run: >-
          npm test -- --run --cache=false
          src/components/ComponentFactory.test.ts
          src/screens/SolutionScreen/SolutionScreenModel.test.ts
          src/screens/SolutionScreen/SolutionScreenController.test.ts
          src/screens/SolutionScreen/SolutionController.test.ts
          src/screens/SolutionScreen/SolutionNavigation.integration.test.ts
          src/screens/SolutionScreen/MultiplicationSolution.integration.test.ts
