name: Treasure Hunt Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Treasure Hunt tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Build and type-check the game
        run: npm run build

      - name: Run treasure hunt and reward screen tests
        run: >-
          npm test -- --run --cache=false
          src/screens/TreasureHuntScreen/
          src/screens/TreasureRewardScreen/
