name: Mini Game 2 Tests (Fraction Sorting)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Mini Game 2 (Fraction Sorting) tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run Mini Game 2 unit tests
        run: >-
          npm test -- --run --cache=false
          src/screens/FractionSortScreen/FractionSortScreenModel.test.ts