name: Adventure Map Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Adventure Map tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Run adventure map unit tests
        run: >-
          npm test -- --run --cache=false
          src/screens/AdventureMapScreen/AdventureMapLayout.test.ts
          src/screens/AdventureMapScreen/AdventureMapScreenModel.test.ts
          src/screens/AdventureMapScreen/AdventureMapScreenModel.progress.test.ts
          src/screens/AdventureMapScreen/AdventureMapScreenController.test.ts
          src/screens/AdventureMapScreen/AdventureMapScreenController.click.test.ts
          src/screens/AdventureMapScreen/AdventureMapScreenController.progress.test.ts
